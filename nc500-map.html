<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NC500 — Scotland · October 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --highland-dark: #1a1f1c;
    --highland-green: #2d4a35;
    --heather: #7a5c7a;
    --whisky: #c4873a;
    --mist: #e8e4de;
    --slate: #4a5568;
    --cream: #f5f1eb;
    --route-drive: #3a7a5c;
    --route-ferry: #c4873a;
    --sidebar-w: 320px;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--highland-dark);
    color: var(--mist);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  header {
    background: var(--highland-dark);
    border-bottom: 1px solid rgba(196,135,58,0.3);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 1000;
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--cream);
    letter-spacing: 0.02em;
  }

  .header-left p {
    font-size: 0.72rem;
    color: rgba(232,228,222,0.55);
    font-weight: 300;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .legend {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.7rem;
    color: rgba(232,228,222,0.65);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  .legend-line {
    width: 28px;
    height: 2px;
  }

  .legend-line.drive { background: var(--route-drive); }
  .legend-line.ferry {
    background: repeating-linear-gradient(90deg, var(--route-ferry) 0, var(--route-ferry) 6px, transparent 6px, transparent 10px);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--whisky);
    border: 2px solid var(--highland-dark);
  }

  /* MAIN */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    width: var(--sidebar-w);
    background: #141917;
    border-right: 1px solid rgba(196,135,58,0.2);
    overflow-y: auto;
    flex-shrink: 0;
    scrollbar-width: thin;
    scrollbar-color: rgba(196,135,58,0.3) transparent;
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(196,135,58,0.3); border-radius: 2px; }

  .sidebar-head {
    padding: 18px 20px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(232,228,222,0.4);
  }

  .stop {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }

  .stop:hover { background: rgba(61,122,92,0.12); }
  .stop.active { background: rgba(61,122,92,0.2); }
  .stop.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--route-drive);
  }

  .stop-date {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--whisky);
    margin-bottom: 4px;
    font-weight: 500;
  }

  .stop-name {
    font-family: 'Playfair Display', serif;
    font-size: 0.95rem;
    color: var(--cream);
    font-weight: 600;
    line-height: 1.2;
    margin-bottom: 3px;
  }

  .stop-hotel {
    font-size: 0.72rem;
    color: rgba(232,228,222,0.55);
    font-style: italic;
    margin-bottom: 5px;
    font-family: 'Playfair Display', serif;
  }

  .stop-desc {
    font-size: 0.68rem;
    color: rgba(232,228,222,0.4);
    line-height: 1.5;
  }

  .stop-badge {
    display: inline-block;
    font-size: 0.58rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 2px 7px;
    border-radius: 2px;
    margin-top: 5px;
    font-weight: 500;
  }

  .badge-rc {
    background: rgba(196,135,58,0.15);
    color: var(--whisky);
    border: 1px solid rgba(196,135,58,0.3);
  }

  .badge-special {
    background: rgba(122,92,122,0.2);
    color: #b59ab5;
    border: 1px solid rgba(122,92,122,0.3);
  }

  .connector {
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(196,135,58,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .connector-line {
    flex: 1;
    height: 1px;
  }

  .connector-line.drive { background: var(--route-drive); opacity: 0.5; }
  .connector-line.ferry {
    background: repeating-linear-gradient(90deg, var(--route-ferry) 0, var(--route-ferry) 5px, transparent 5px, transparent 9px);
  }

  .connector-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(232,228,222,0.35);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .connector-label.ferry-label { color: var(--whisky); opacity: 0.8; }

  /* MAP */
  #map {
    flex: 1;
    background: #1a1f1c;
  }

  /* POPUP */
  .leaflet-popup-content-wrapper {
    background: #1e2520;
    border: 1px solid rgba(196,135,58,0.4);
    border-radius: 4px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    color: var(--mist);
  }

  .leaflet-popup-tip { background: #1e2520; }
  .leaflet-popup-close-button { color: rgba(232,228,222,0.5) !important; }

  .popup-date {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--whisky);
    margin-bottom: 4px;
  }

  .popup-name {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--cream);
    font-weight: 600;
    margin-bottom: 3px;
  }

  .popup-hotel {
    font-size: 0.72rem;
    color: rgba(232,228,222,0.6);
    font-style: italic;
    font-family: 'Playfair Display', serif;
    margin-bottom: 4px;
  }

  .popup-notes {
    font-size: 0.68rem;
    color: rgba(232,228,222,0.45);
    line-height: 1.5;
  }

  /* MOBILE */
  @media (max-width: 640px) {
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid rgba(196,135,58,0.2); max-height: 40vh; }
    .main { flex-direction: column; }
    #map { min-height: 60vh; }
    header { padding: 10px 16px; }
    .legend { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>North Coast 500 &amp; The Neolithic Isles</h1>
    <p>Scotland · 3–11 October 2026 · Counter-clockwise</p>
  </div>
  <div class="legend">
    <div class="legend-item">
      <div class="legend-line drive"></div>
      Drive
    </div>
    <div class="legend-item">
      <div class="legend-line ferry"></div>
      Ferry
    </div>
    <div class="legend-item">
      <div class="legend-dot"></div>
      Stop
    </div>
  </div>
</header>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-head">9 Days · 8 Nights · 8 Stops</div>
    <div id="stop-list"></div>
  </div>
  <div id="map"></div>
</div>

<script>
const stops = [
  {
    id: 0,
    date: "Sat 3 Oct",
    name: "Contin",
    region: "Ross-shire",
    hotel: "Coul House Hotel",
    lat: 57.5975,
    lng: -4.5423,
    desc: "Arrive Inverness 5:00pm · 35 min drive to Contin · Whisky bar & fire",
    badges: []
  },
  {
    id: 1,
    date: "Sun 4 Oct",
    name: "Gairloch",
    region: "Wester Ross",
    hotel: "Shieldaig Lodge",
    lat: 57.7268,
    lng: -5.6803,
    desc: "Bealach na Bà · Applecross Inn lunch · Glen Torridon drive",
    badges: []
  },
  {
    id: 2,
    date: "Mon 5 Oct",
    name: "Kylesku",
    region: "Sutherland",
    hotel: "Kylesku Hotel",
    lat: 58.2565,
    lng: -4.9989,
    desc: "Corrieshalloch Gorge · Ardvreck Castle · Wailing Widow Falls",
    badges: []
  },
  {
    id: 3,
    date: "Tue 6 Oct",
    name: "Orkney",
    region: "Orkney Islands",
    hotel: "The Lynnfield Hotel",
    lat: 58.9809,
    lng: -2.9605,
    desc: "Smoo Cave · Balnakeil · Strathy Beach · NorthLink ferry Scrabster→Stromness",
    badges: ["ferry"],
    ferryNote: "NorthLink Ferry: Scrabster → Stromness"
  },
  {
    id: 4,
    date: "Wed 7 Oct",
    name: "Orkney (Full Day)",
    region: "Orkney Islands",
    hotel: "The Lynnfield Hotel",
    lat: 58.9809,
    lng: -2.9605,
    desc: "Ring of Brodgar · Skara Brae · Maeshowe · Highland Park Distillery · Grey seals at Birsay",
    badges: ["special"]
  },
  {
    id: 5,
    date: "Thu 8 Oct",
    name: "Thurso",
    region: "Caithness",
    hotel: "Forss House Hotel",
    lat: 58.5936,
    lng: -3.8578,
    desc: "Italian Chapel · Kirkwall · Ferry return Stromness→Scrabster · Dunnet Head",
    badges: []
  },
  {
    id: 6,
    date: "Fri 9 Oct",
    name: "Brora",
    region: "Sutherland",
    hotel: "Royal Marine Hotel",
    lat: 57.9997,
    lng: -3.8553,
    desc: "Dunrobin Castle · Brora Cashmere mill shop · Wolfburn Distillery · Coastal A9",
    badges: []
  },
  {
    id: 7,
    date: "Sat 10 Oct",
    name: "Inverness",
    region: "Inverness-shire",
    hotel: "Rocpool Reserve",
    lat: 57.4778,
    lng: -4.2247,
    desc: "Chanonry Point · Glenmorangie · The Malt Room whisky tasting · Farewell dinner",
    badges: ["special"]
  }
];

// Route: full coordinate path counter-clockwise NC500
// Split into drive segments and ferry segment
const driveSegment1 = [
  [57.4778, -4.2247],  // Inverness
  [57.5975, -4.5423],  // Contin
  [57.4510, -5.8150],  // Applecross area
  [57.5268, -5.6803],  // near Shieldaig
  [57.7268, -5.6200],  // Gairloch
  [57.9124, -5.1582],  // Poolewe
  [57.8952, -5.1600],  // Corrieshalloch area
  [58.0520, -5.1637],  // Ullapool area
  [58.1636, -5.0363],  // Ardvreck Castle
  [58.2565, -4.9989],  // Kylesku
  [58.3968, -5.0012],  // Scourie
  [58.5678, -4.9980],  // near Durness
  [58.5650, -4.7234],  // Smoo Cave
  [58.5680, -4.7000],  // Durness
  [58.5320, -4.2800],  // Strathy
  [58.5936, -3.8578],  // Thurso/Scrabster
];

// Ferry: Scrabster to Stromness
const ferrySegment = [
  [58.6121, -3.5304],  // Scrabster
  [58.9650, -3.3000],  // mid-Pentland Firth
  [58.9780, -3.2970],  // Stromness approach
];

// Orkney internal drive
const orkneySegment = [
  [58.9780, -3.2970],  // Stromness
  [58.9970, -3.1700],  // Ring of Brodgar
  [59.0484, -3.3465],  // Skara Brae
  [58.9809, -2.9605],  // Kirkwall / Lynnfield
];

// Return ferry: Stromness to Scrabster
const ferryReturn = [
  [58.9780, -3.2970],
  [58.9650, -3.3000],
  [58.6121, -3.5304],
];

// East coast return
const driveSegment2 = [
  [58.6121, -3.5304],  // Scrabster
  [58.5936, -3.8578],  // Thurso / Forss House
  [58.6316, -3.3750],  // Dunnet Head
  [58.5936, -3.1700],  // John O'Groats area
  [58.4602, -3.0879],  // Wick
  [58.3190, -3.1479],  // Lybster
  [57.9997, -3.8553],  // Brora
  [57.9760, -3.8900],  // Dunrobin Castle
  [57.8777, -4.0776],  // Tain / Glenmorangie
  [57.6402, -4.1400],  // Dingwall / Chanonry area
  [57.5700, -4.2500],  // Black Isle
  [57.4778, -4.2247],  // Inverness
];

// Marker icon factory
function makeIcon(color, size = 10) {
  return L.divIcon({
    className: '',
    html: `<div style="
      width:${size}px;height:${size}px;
      background:${color};
      border:2.5px solid #141917;
      border-radius:50%;
      box-shadow:0 2px 8px rgba(0,0,0,0.6);
    "></div>`,
    iconSize: [size, size],
    iconAnchor: [size/2, size/2]
  });
}

// Map init — dark tile
const map = L.map('map', {
  center: [58.2, -4.0],
  zoom: 6,
  zoomControl: true,
  attributionControl: false
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 18
}).addTo(map);

L.control.attribution({ prefix: '© OpenStreetMap · © CartoDB' }).addTo(map);

// Draw routes
L.polyline(driveSegment1, { color: '#3a7a5c', weight: 2.5, opacity: 0.85 }).addTo(map);
L.polyline(ferrySegment, { color: '#c4873a', weight: 2.5, opacity: 0.85, dashArray: '8, 6' }).addTo(map);
L.polyline(orkneySegment, { color: '#3a7a5c', weight: 2, opacity: 0.7 }).addTo(map);
L.polyline(ferryReturn, { color: '#c4873a', weight: 2.5, opacity: 0.85, dashArray: '8, 6' }).addTo(map);
L.polyline(driveSegment2, { color: '#3a7a5c', weight: 2.5, opacity: 0.85 }).addTo(map);

// Ferry midpoint boat icon
const ferryMid = L.divIcon({
  className: '',
  html: `<div style="font-size:16px;line-height:1;">⛴</div>`,
  iconSize: [20, 20],
  iconAnchor: [10, 10]
});
L.marker([58.80, -3.42], { icon: ferryMid }).addTo(map);

// Stop markers + popups
const markers = [];
stops.forEach((s, i) => {
  // Skip duplicate Orkney marker
  if (i === 4) return;

  const color = i === 0 ? '#7a5c7a' : i === 7 ? '#7a5c7a' : '#c4873a';
  const sz = i === 0 || i === 7 ? 13 : 11;
  const marker = L.marker([s.lat, s.lng], { icon: makeIcon(color, sz) });

  const badgeHTML = s.badges.map(b => {
    if (b === 'rc') return `<span style="display:inline-block;font-size:0.6rem;padding:2px 7px;background:rgba(196,135,58,0.15);border:1px solid rgba(196,135,58,0.4);color:#c4873a;border-radius:2px;margin-top:4px;">Relais & Châteaux</span>`;
    if (b === 'special') return `<span style="display:inline-block;font-size:0.6rem;padding:2px 7px;background:rgba(122,92,122,0.2);border:1px solid rgba(122,92,122,0.4);color:#b59ab5;border-radius:2px;margin-top:4px;">Special Meal</span>`;
    if (b === 'ferry') return `<span style="display:inline-block;font-size:0.6rem;padding:2px 7px;background:rgba(196,135,58,0.1);border:1px solid rgba(196,135,58,0.3);color:#c4873a;border-radius:2px;margin-top:4px;">⛴ ${s.ferryNote}</span>`;
    return '';
  }).join(' ');

  marker.bindPopup(`
    <div style="min-width:200px;padding:2px">
      <div class="popup-date">${s.date}</div>
      <div class="popup-name">${s.name}</div>
      <div class="popup-hotel">${s.hotel}</div>
      <div class="popup-notes">${s.desc}</div>
      ${badgeHTML}
    </div>
  `, { maxWidth: 260 });

  marker.addTo(map);
  markers.push({ marker, stop: s, index: i });
});

// Sidebar
const list = document.getElementById('stop-list');
stops.forEach((s, i) => {
  // Connector before stop
  if (i > 0) {
    const isOrkney = (i === 3);
    const isReturnFerry = (i === 5);
    const conn = document.createElement('div');
    conn.className = 'connector';

    let lineClass = 'drive';
    let label = 'Drive';
    let labelClass = 'connector-label';

    if (isOrkney) {
      lineClass = 'ferry';
      label = '⛴  NorthLink Ferry · Scrabster → Stromness · ~90 min';
      labelClass = 'connector-label ferry-label';
    } else if (isReturnFerry) {
      lineClass = 'ferry';
      label = '⛴  Return Ferry · Stromness → Scrabster';
      labelClass = 'connector-label ferry-label';
    }

    conn.innerHTML = `
      <div class="connector-line ${lineClass}"></div>
      <span class="${labelClass}">${label}</span>
      <div class="connector-line ${lineClass}"></div>
    `;
    list.appendChild(conn);
  }

  const el = document.createElement('div');
  el.className = 'stop';
  el.dataset.index = i;

  const badgeHTML = s.badges.map(b => {
    if (b === 'rc') return `<span class="stop-badge badge-rc">Relais &amp; Châteaux</span>`;
    if (b === 'special') return `<span class="stop-badge badge-special">Special Meal</span>`;
    return '';
  }).join(' ');

  el.innerHTML = `
    <div class="stop-date">${s.date} · ${s.region}</div>
    <div class="stop-name">${s.name}</div>
    <div class="stop-hotel">${s.hotel}</div>
    <div class="stop-desc">${s.desc}</div>
    ${badgeHTML}
  `;

  el.addEventListener('click', () => {
    document.querySelectorAll('.stop').forEach(x => x.classList.remove('active'));
    el.classList.add('active');

    // Find matching marker
    const found = markers.find(m => m.index === i || (i === 4 && m.index === 3));
    if (found) {
      map.setView([found.stop.lat, found.stop.lng], 9, { animate: true });
      found.marker.openPopup();
    }
  });

  list.appendChild(el);
});
</script>

</body>
</html>
