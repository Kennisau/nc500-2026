<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NC500 — Scotland · October 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f4f0eb;
    --sidebar-bg: #faf7f3;
    --header-bg: #3a5241;
    --header-text: #f4f0eb;
    --text-dark: #2c3329;
    --text-mid: #5a6358;
    --text-light: #8a9488;
    --whisky: #b87333;
    --whisky-light: #f0e4d4;
    --heather: #7a5c7a;
    --heather-light: #ede6ed;
    --green: #3a5241;
    --green-light: #e4ede6;
    --border: #ddd8d0;
    --route-drive: #3a7a5c;
    --route-ferry: #b87333;
    --sidebar-w: 320px;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text-dark);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  header {
    background: var(--header-bg);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 1000;
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--header-text);
    letter-spacing: 0.02em;
  }

  .header-left p {
    font-size: 0.68rem;
    color: rgba(244,240,235,0.6);
    font-weight: 300;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .legend {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.68rem;
    color: rgba(244,240,235,0.75);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  .legend-line {
    width: 28px;
    height: 2px;
  }

  .legend-line.drive { background: #6ab891; }
  .legend-line.ferry {
    background: repeating-linear-gradient(90deg, #e8a96a 0, #e8a96a 6px, transparent 6px, transparent 10px);
  }

  .legend-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--whisky);
    border: 2px solid var(--header-bg);
  }

  /* MAIN */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .sidebar-head {
    padding: 14px 20px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-light);
    background: var(--bg);
  }

  .stop {
    padding: 13px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
    background: var(--sidebar-bg);
  }

  .stop:hover { background: var(--green-light); }
  .stop.active { background: var(--green-light); }
  .stop.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--green);
  }

  .stop-date {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--whisky);
    margin-bottom: 3px;
    font-weight: 500;
  }

  .stop-name {
    font-family: 'Playfair Display', serif;
    font-size: 0.95rem;
    color: var(--text-dark);
    font-weight: 600;
    line-height: 1.2;
    margin-bottom: 2px;
  }

  .stop-hotel {
    font-size: 0.71rem;
    color: var(--text-mid);
    font-style: italic;
    margin-bottom: 4px;
    font-family: 'Playfair Display', serif;
  }

  .stop-desc {
    font-size: 0.67rem;
    color: var(--text-light);
    line-height: 1.5;
  }

  .stop-badge {
    display: inline-block;
    font-size: 0.57rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 2px 7px;
    border-radius: 2px;
    margin-top: 5px;
    font-weight: 500;
  }

  .badge-special {
    background: var(--heather-light);
    color: var(--heather);
    border: 1px solid rgba(122,92,122,0.25);
  }

  .badge-ferry {
    background: var(--whisky-light);
    color: var(--whisky);
    border: 1px solid rgba(184,115,51,0.25);
  }

  .connector {
    padding: 7px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .connector-line { flex: 1; height: 1px; }
  .connector-line.drive { background: var(--route-drive); opacity: 0.4; }
  .connector-line.ferry {
    background: repeating-linear-gradient(90deg, var(--route-ferry) 0, var(--route-ferry) 5px, transparent 5px, transparent 9px);
    opacity: 0.6;
  }

  .connector-label {
    font-size: 0.58rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-light);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .connector-label.ferry-label { color: var(--whisky); }

  /* MAP */
  #map { flex: 1; }

  /* POPUP */
  .leaflet-popup-content-wrapper {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    color: var(--text-dark);
  }

  .leaflet-popup-tip { background: #fff; }

  .popup-date {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--whisky);
    margin-bottom: 3px;
  }

  .popup-name {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    color: var(--text-dark);
    font-weight: 600;
    margin-bottom: 2px;
  }

  .popup-hotel {
    font-size: 0.71rem;
    color: var(--text-mid);
    font-style: italic;
    font-family: 'Playfair Display', serif;
    margin-bottom: 4px;
  }

  .popup-notes {
    font-size: 0.67rem;
    color: var(--text-light);
    line-height: 1.5;
  }

  @media (max-width: 640px) {
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
    .main { flex-direction: column; }
    #map { min-height: 60vh; }
    .legend { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>North Coast 500 &amp; The Neolithic Isles</h1>
    <p>Scotland · 3–11 October 2026 · Counter-clockwise</p>
  </div>
  <div class="legend">
    <div class="legend-item">
      <div class="legend-line drive"></div>
      Drive
    </div>
    <div class="legend-item">
      <div class="legend-line ferry"></div>
      Ferry
    </div>
    <div class="legend-item">
      <div class="legend-dot"></div>
      Stop
    </div>
  </div>
</header>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-head">9 Days · 8 Nights · 8 Stops</div>
    <div id="stop-list"></div>
  </div>
  <div id="map"></div>
</div>

<script>
const stops = [
  {
    id: 0,
    date: "Sat 3 Oct",
    name: "Contin",
    region: "Ross-shire",
    hotel: "Coul House Hotel",
    lat: 57.5975,
    lng: -4.5423,
    desc: "Arrive Inverness 5:00pm · 35 min drive · Whisky bar & fire",
    badges: []
  },
  {
    id: 1,
    date: "Sun 4 Oct",
    name: "Gairloch",
    region: "Wester Ross",
    hotel: "Shieldaig Lodge",
    lat: 57.7268,
    lng: -5.6803,
    desc: "Bealach na Bà · Applecross Inn lunch · Glen Torridon",
    badges: []
  },
  {
    id: 2,
    date: "Mon 5 Oct",
    name: "Kylesku",
    region: "Sutherland",
    hotel: "Kylesku Hotel",
    lat: 58.2565,
    lng: -4.9989,
    desc: "Corrieshalloch Gorge · Ardvreck Castle · Wailing Widow Falls",
    badges: []
  },
  {
    id: 3,
    date: "Tue 6 Oct",
    name: "Orkney",
    region: "Orkney Islands",
    hotel: "The Lynnfield Hotel",
    lat: 58.9809,
    lng: -2.9605,
    desc: "Smoo Cave · Balnakeil · Strathy Beach · NorthLink ferry Scrabster→Stromness",
    badges: ["ferry"],
    ferryNote: "NorthLink Ferry · Scrabster → Stromness"
  },
  {
    id: 4,
    date: "Wed 7 Oct",
    name: "Orkney (Full Day)",
    region: "Orkney Islands",
    hotel: "The Lynnfield Hotel",
    lat: 58.9809,
    lng: -2.9605,
    desc: "Ring of Brodgar · Skara Brae · Maeshowe · Highland Park · Grey seals at Birsay",
    badges: ["special"]
  },
  {
    id: 5,
    date: "Thu 8 Oct",
    name: "Thurso",
    region: "Caithness",
    hotel: "Forss House Hotel",
    lat: 58.5936,
    lng: -3.8578,
    desc: "Italian Chapel · Kirkwall · Return ferry Stromness→Scrabster · Dunnet Head",
    badges: []
  },
  {
    id: 6,
    date: "Fri 9 Oct",
    name: "Brora",
    region: "Sutherland",
    hotel: "Royal Marine Hotel",
    lat: 57.9997,
    lng: -3.8553,
    desc: "Dunrobin Castle · Brora Cashmere · Wolfburn Distillery",
    badges: []
  },
  {
    id: 7,
    date: "Sat 10 Oct",
    name: "Inverness",
    region: "Inverness-shire",
    hotel: "Rocpool Reserve",
    lat: 57.4778,
    lng: -4.2247,
    desc: "Chanonry Point · Glenmorangie · The Malt Room · Farewell dinner",
    badges: ["special"]
  }
];

const driveSegment1 = [
  [57.4778, -4.2247],
  [57.5975, -4.5423],
  [57.4510, -5.8150],
  [57.5268, -5.6803],
  [57.7268, -5.6200],
  [57.9124, -5.1582],
  [57.8952, -5.1600],
  [58.0520, -5.1637],
  [58.1636, -5.0363],
  [58.2565, -4.9989],
  [58.3968, -5.0012],
  [58.5678, -4.9980],
  [58.5650, -4.7234],
  [58.5680, -4.7000],
  [58.5320, -4.2800],
  [58.6121, -3.5304],
];

const ferryOut = [
  [58.6121, -3.5304],
  [58.9650, -3.3000],
  [58.9780, -3.2970],
];

const orkneyDrive = [
  [58.9780, -3.2970],
  [58.9970, -3.1700],
  [59.0484, -3.3465],
  [58.9809, -2.9605],
];

const ferryReturn = [
  [58.9780, -3.2970],
  [58.9650, -3.3000],
  [58.6121, -3.5304],
];

const driveSegment2 = [
  [58.6121, -3.5304],
  [58.5936, -3.8578],
  [58.6316, -3.3750],
  [58.5936, -3.1700],
  [58.4602, -3.0879],
  [57.9997, -3.8553],
  [57.9760, -3.8900],
  [57.8777, -4.0776],
  [57.6402, -4.1400],
  [57.5700, -4.2500],
  [57.4778, -4.2247],
];

function makeIcon(color, size = 11) {
  return L.divIcon({
    className: '',
    html: `<div style="width:${size}px;height:${size}px;background:${color};border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 6px rgba(0,0,0,0.25);"></div>`,
    iconSize: [size, size],
    iconAnchor: [size/2, size/2]
  });
}

const map = L.map('map', {
  center: [58.1, -4.2],
  zoom: 6,
  zoomControl: true,
  attributionControl: false
});

// CartoDB Voyager — warm cream land, clearly distinct blue-grey water
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  maxZoom: 19,
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>'
}).addTo(map);

L.control.attribution({ prefix: false }).addTo(map);

// Routes
L.polyline(driveSegment1, { color: '#3a7a5c', weight: 3, opacity: 0.8 }).addTo(map);
L.polyline(ferryOut, { color: '#b87333', weight: 2.5, opacity: 0.85, dashArray: '8, 6' }).addTo(map);
L.polyline(orkneyDrive, { color: '#3a7a5c', weight: 2.5, opacity: 0.7 }).addTo(map);
L.polyline(ferryReturn, { color: '#b87333', weight: 2.5, opacity: 0.85, dashArray: '8, 6' }).addTo(map);
L.polyline(driveSegment2, { color: '#3a7a5c', weight: 3, opacity: 0.8 }).addTo(map);

// Ferry icon
L.marker([58.80, -3.42], {
  icon: L.divIcon({
    className: '',
    html: `<div style="font-size:15px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.3));">⛴</div>`,
    iconSize: [20, 20],
    iconAnchor: [10, 10]
  })
}).addTo(map);

// Markers
const markers = [];
stops.forEach((s, i) => {
  if (i === 4) return;
  const isEndpoint = i === 0 || i === 7;
  const color = isEndpoint ? '#3a5241' : '#b87333';
  const sz = isEndpoint ? 14 : 11;
  const marker = L.marker([s.lat, s.lng], { icon: makeIcon(color, sz) });

  const badgeHTML = s.badges.map(b => {
    if (b === 'special') return `<span style="display:inline-block;font-size:0.58rem;padding:2px 7px;background:#ede6ed;border:1px solid rgba(122,92,122,0.25);color:#7a5c7a;border-radius:2px;margin-top:4px;">Special Meal</span>`;
    if (b === 'ferry') return `<span style="display:inline-block;font-size:0.58rem;padding:2px 7px;background:#f0e4d4;border:1px solid rgba(184,115,51,0.25);color:#b87333;border-radius:2px;margin-top:4px;">⛴ ${s.ferryNote}</span>`;
    return '';
  }).join(' ');

  marker.bindPopup(`
    <div style="min-width:200px;padding:2px;font-family:'Inter',sans-serif;">
      <div class="popup-date" style="font-size:0.6rem;text-transform:uppercase;letter-spacing:0.1em;color:#b87333;margin-bottom:3px;">${s.date}</div>
      <div class="popup-name" style="font-family:'Playfair Display',serif;font-size:1rem;color:#2c3329;font-weight:600;margin-bottom:2px;">${s.name}</div>
      <div class="popup-hotel" style="font-size:0.71rem;color:#5a6358;font-style:italic;font-family:'Playfair Display',serif;margin-bottom:4px;">${s.hotel}</div>
      <div class="popup-notes" style="font-size:0.67rem;color:#8a9488;line-height:1.5;">${s.desc}</div>
      <div style="margin-top:4px;">${badgeHTML}</div>
    </div>
  `, { maxWidth: 260 });

  marker.addTo(map);
  markers.push({ marker, stop: s, index: i });
});

// Sidebar
const list = document.getElementById('stop-list');
stops.forEach((s, i) => {
  if (i > 0) {
    const isFerryOut = i === 3;
    const isFerryBack = i === 5;
    const conn = document.createElement('div');
    conn.className = 'connector';
    let lineClass = 'drive', label = 'Drive', labelClass = 'connector-label';
    if (isFerryOut) {
      lineClass = 'ferry';
      label = '⛴  NorthLink Ferry · Scrabster → Stromness';
      labelClass = 'connector-label ferry-label';
    } else if (isFerryBack) {
      lineClass = 'ferry';
      label = '⛴  Return Ferry · Stromness → Scrabster';
      labelClass = 'connector-label ferry-label';
    }
    conn.innerHTML = `
      <div class="connector-line ${lineClass}"></div>
      <span class="${labelClass}">${label}</span>
      <div class="connector-line ${lineClass}"></div>
    `;
    list.appendChild(conn);
  }

  const el = document.createElement('div');
  el.className = 'stop';
  el.dataset.index = i;

  const badgeHTML = s.badges.map(b => {
    if (b === 'special') return `<span class="stop-badge badge-special">Special Meal</span>`;
    if (b === 'ferry') return `<span class="stop-badge badge-ferry">⛴ Ferry crossing</span>`;
    return '';
  }).join(' ');

  el.innerHTML = `
    <div class="stop-date">${s.date} · ${s.region}</div>
    <div class="stop-name">${s.name}</div>
    <div class="stop-hotel">${s.hotel}</div>
    <div class="stop-desc">${s.desc}</div>
    ${badgeHTML}
  `;

  el.addEventListener('click', () => {
    document.querySelectorAll('.stop').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    const found = markers.find(m => m.index === i || (i === 4 && m.index === 3));
    if (found) {
      map.setView([found.stop.lat, found.stop.lng], 9, { animate: true });
      found.marker.openPopup();
    }
  });

  list.appendChild(el);
});
</script>

</body>
</html>
